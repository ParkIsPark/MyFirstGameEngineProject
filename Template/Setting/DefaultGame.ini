# DefaultGame.ini — game rules / default classes / physics tuning.
[Render]
SSAA = 1
AmbientStrength = 1.0
ShadowSamples = 4
ShadowSoftness = 0.05
GISamples = 4
GIBounces = 1
GIStrength = 1.0
ReflectionStrength = 1.0
Shininess = 32.0
ExposureEV = 0.0
TemporalFrames = 32
Anisotropy = 8

[Game]
DefaultPawn       = UPlayerCharacter
DefaultController = UPlayerController

[Physics]
GravityEnabled = true        # world-wide gravity simulation on/off
Gravity        = 0 -9.8 0    # no default floor — place a BoxCollision actor as the ground
